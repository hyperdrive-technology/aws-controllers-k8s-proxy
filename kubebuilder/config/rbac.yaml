apiVersion: v1
kind: ServiceAccount
metadata:
  name: universal-proxy-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: universal-proxy-controller
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get","list","watch","create","update","patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get","list","watch","update","patch"]
- apiGroups: ["ec2.services.k8s.aws","rds.services.k8s.aws","s3.services.k8s.aws","dynamodb.services.k8s.aws"]
  resources: ["*"]
  verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: universal-proxy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: universal-proxy-controller
subjects:
- kind: ServiceAccount
  name: universal-proxy-controller
  namespace: default