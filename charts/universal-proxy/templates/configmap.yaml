{{- if .Values.configMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ default (include "universal-proxy.fullname" .) .Values.configMap.name }}
  labels:
    {{- include "universal-proxy.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    static_resources:
      listeners:
      {{- range $i, $svc := .Values.http.services }}
      - name: http_{{ $svc.name }}
        address:
          socket_address: { address: 0.0.0.0, port_value: {{ $svc.listenerPort }} }
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: http_{{ $svc.name }}
              route_config:
                name: route_{{ $svc.name }}
                virtual_hosts:
                - name: vh_{{ $svc.name }}
                  domains: ["*"]
                  routes:
                  - match: { prefix: "/" }
                    route:
                      cluster: http_upstream_{{ $svc.name }}
                      {{- if and $svc.routing $svc.routing.prefixRewrite }}
                      prefix_rewrite: {{ $svc.routing.prefixRewrite | quote }}
                      {{- end }}
                      {{- if and $svc.routing $svc.routing.hostRewrite }}
                      host_rewrite_literal: {{ $svc.routing.hostRewrite | quote }}
                      {{- end }}
                    {{- if and $svc.sigv4 $svc.sigv4.enabled }}
                    typed_per_filter_config:
                      envoy.filters.http.aws_request_signing:
                        "@type": type.googleapis.com/envoy.extensions.filters.http.aws_request_signing.v3.AwsRequestSigningPerRoute
                        override_config:
                          service_name: {{ $svc.sigv4.serviceName | quote }}
                          region: {{ $svc.sigv4.region | quote }}
                          {{- if hasKey $svc.sigv4 "useUnsignedPayload" }}
                          use_unsigned_payload: {{ $svc.sigv4.useUnsignedPayload }}
                          {{- end }}
                    {{- end }}
              http_filters:
              {{- if and $svc.sigv4 $svc.sigv4.enabled }}
              - name: envoy.filters.http.aws_request_signing
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.aws_request_signing.v3.AwsRequestSigning
                  service_name: {{ $svc.sigv4.serviceName | quote }}
                  region: {{ $svc.sigv4.region | quote }}
                  {{- if hasKey $svc.sigv4 "useUnsignedPayload" }}
                  use_unsigned_payload: {{ $svc.sigv4.useUnsignedPayload }}
                  {{- end }}
              {{- end }}
              - name: envoy.filters.http.router
      {{- end }}

      {{- range $i, $svc := .Values.tcp.services }}
      - name: tcp_{{ $svc.name }}
        address:
          socket_address: { address: 0.0.0.0, port_value: {{ $svc.listenerPort }} }
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: tcp_{{ $svc.name }}
              cluster: tcp_upstream_{{ $svc.name }}
      {{- end }}

      clusters:
      {{- range $i, $svc := .Values.http.services }}
      - name: http_upstream_{{ $svc.name }}
        connect_timeout: 2s
        type: LOGICAL_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: http_upstream_{{ $svc.name }}
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ $svc.upstream.host | quote }}
                    port_value: {{ $svc.upstream.port }}
        {{- if $svc.upstream.tls }}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: {{ default $svc.upstream.host $svc.upstream.sni | quote }}
        {{- end }}
      {{- end }}

      {{- range $i, $svc := .Values.tcp.services }}
      - name: tcp_upstream_{{ $svc.name }}
        connect_timeout: 2s
        type: LOGICAL_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: tcp_upstream_{{ $svc.name }}
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ $svc.upstream.host | quote }}
                    port_value: {{ $svc.upstream.port }}
        {{- if $svc.upstream.tls }}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: {{ default $svc.upstream.host $svc.upstream.sni | quote }}
        {{- end }}
      {{- end }}

    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address: { address: 127.0.0.1, port_value: 9901 }
{{- end }}